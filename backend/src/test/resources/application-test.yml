spring:
  datasource:
    # 개발 DB(studyroom)와 분리된 테스트 전용 DB
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/studyroom_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}

  # 테스트 DB도 운영과 같은 Flyway SQL로 만든다 (TestFlywayConfig에서 매번 비우고 다시 실행)
  flyway:
    clean-disabled: false   # clean(테이블 전부 삭제)은 위험해서 기본으로 막혀 있음. 테스트 DB에서만 허용

jwt:
  # 테스트 전용 고정 키. 실제 서비스 키와는 아무 관계 없음
  secret: test-only-secret-key-that-is-long-enough-1234567890
